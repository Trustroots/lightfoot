name: Deploy to GitHub Pages

on:
  push:
    branches: "main"
  workflow_dispatch:

# Pages accepts one deployment at a time: queue a new push behind a running deploy instead of
# failing it. In-progress runs aren't cancelled, so every deploy finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm run build

      # The custom domain serves from the root, so the Vite base path stays "/".
      - name: Keep the custom domain
        run: cp CNAME apps/web/dist/CNAME

      # Until the map launches, the site is the placeholder page (what Lightfoot is, the roadmap,
      # the repo). To launch, set the repository variable LIGHTFOOT_LAUNCH to "true".
      - name: Serve the placeholder before launch
        if: vars.LIGHTFOOT_LAUNCH != 'true'
        run: |
          cp apps/web/dist/placeholder.html apps/web/dist/index.html
          cp apps/web/dist/placeholder.html apps/web/dist/404.html

      # GitHub Pages has no SPA rewrites: serve the app for unknown paths like /box/<d>.
      - name: Add the SPA fallback
        if: vars.LIGHTFOOT_LAUNCH == 'true'
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "apps/web/dist/"

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
